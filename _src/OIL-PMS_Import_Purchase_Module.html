function isWork(cal,d){const s=isoD(d),w=d.getUTCDay();if(cal.makeup.includes(s))return true;if(cal.holidays.includes(s))return false;return w!==0&&w!==6}

function calcDeadline(key,issueTs,n){
  const cal=DB.cal[key];
  if(!cal||!cal.approved)return{err:`Working-day calendar “${key}” is not approved — deadline can't be computed.`};
  let d=localMid(cal,issueTs),c=0,g=0;
  if(!cal.years.includes(d.getUTCFullYear()))return{err:`Holiday data for ${d.getUTCFullYear()} not verified for ${key}.`};
  while(c<n){d=new Date(d.getTime()+DAY);if(!cal.years.includes(d.getUTCFullYear()))return{err:`Holiday data for ${d.getUTCFullYear()} not verified for ${key} — publication blocked.`};if(isWork(cal,d))c++;if(++g>60)return{err:'Calendar range error'}}

}

function elig(c,b,pid){
  if(b.q.sample==='Fail')return{ok:false,why:'Sample failed — blocked from award'};
  if(b.q.sample==='Pending')return{ok:false,why:'Sample result pending (QA)'};
  if(b.q.validity<NOW())return{ok:false,why:'Quote validity expired'};
  const rq=reqQty(c,pid);
  const w=[];if(b.q.sample==='Conditional')w.push('Conditional pass — needs approved deviation');if(b.q.moq>rq)w.push(`MOQ ${n0(b.q.moq)} exceeds required ${n0(rq)}`);const dv=devFor(c,b.sid,pid);if(dv)w.push('Declared deviation: '+dv);

const csOf=(c,pid)=>c.cs[pid]||(c.cs[pid]={alloc:{},just:'',excl:false,exclWhy:'',fin:'',neg:[],waiver:{}});
const allocSum=(c,pid)=>Object.values(csOf(c,pid).alloc).reduce((a,b)=>a+b,0);

function scored(c,pid){
  const bs=bids(c,pid).filter(b=>b.q.sample!=='Fail');if(!bs.length)return{};
  const mL=Math.min(...bs.map(b=>landed(b.q))),mD=Math.min(...bs.map(b=>b.q.days));
  return Object.fromEntries(bs.map(b=>[b.sid,W.cost*mL/landed(b.q)*100+W.tech*b.q.q+W.del*mD/b.q.days*100+W.terms*b.q.terms+W.hist*b.q.hist]));

function tasksFor(role){
  const T=[],add=(t,go,k,cid)=>T.push({t,go,k:k||'',cid});
  DB.cases.forEach(c=>{
    const cnt=csCounts(c),A=c.appr,pend=c.demand.filter(d=>d.status==='pending').length,i=flowIdx(c);if(i>=8)return;
    if(role==='exec'||role==='sup'){
      if(!c.frozen&&pend)add(`Verify ${pend} pending requisition line(s)`,'rq.board','warn',c.id);
      else if(!c.frozen)add('Freeze the validated requisition','rq.board','ok',c.id);
      if(c.frozen&&!c.booking.confirmed)add('Confirm book qty — signed document required','rq.booking','warn',c.id);
      if(c.booking.confirmed&&!c.drafts.length)add('Create the RFQ from the confirmed booking','src.rfq','warn',c.id);
      if(c.drafts.some(d=>d.status==='Draft'))add('Review and send RFQ drafts','src.rfq','warn',c.id);
      if(c.drafts.some(d=>d.status==='Blocked'))add('RFQ draft blocked — supplier calendar not approved','ad.cal','bad',c.id);
      DB.exc.filter(e=>e.type==='No bid'&&e.status==='Open'&&e.cid===c.id).forEach(e=>add(`No bid for ${e.ref} — extend deadline or re-tender`,'src.track','bad',c.id));
      if(c.inv.length&&cnt.pend&&rfqClosed(c))add(`${cnt.pend} product(s) to decide in the comparative statement`,'src.cs','warn',c.id);
      if(c.inv.length&&cnt.total&&!cnt.pend&&!c.csLocked&&A.status!=='approved')add('Comparison complete — submit the award recommendation','aw.rec','ok',c.id);
      if(['returned','rejected'].includes(A.status))add(`${A.id} ${A.status} — revise and resubmit`,'src.cs','bad',c.id);
      c.pos.filter(p=>!p.sent&&!p.frozen).forEach(p=>add(`${p.no}: ${poStatus(c,p)==='Ready to Dispatch'?'dispatch to supplier':'fix correction-queue items'}`,'po.reg',poStatus(c,p)==='Ready to Dispatch'?'warn':'bad',c.id));
      c.pos.filter(p=>p.ack==='Disputed').forEach(p=>add(`${p.no} disputed — resolve`,'po.disp','bad',c.id));
      c.pos.filter(p=>p.ack==='Accepted'&&!c.pis[p.no]).forEach(p=>add(`${p.no} accepted — record supplier PI`,'imp.pi','warn',c.id));
    }
    if(role==='mkt'&&A.status==='mkt')add(`Acknowledge ${A.id} v${A.version}`,'aw.appr','warn',c.id);
    if(role==='fin'){if(A.status==='fin')add(`Finance approval for ${A.id} v${A.version}`,'aw.appr','warn',c.id);c.pos.forEach(p=>{const l=c.lc[p.no],pi=c.pis[p.no];if(l&&l.docsDone&&!l.appr)add(`Approve LC for ${p.no}`,'imp.lc','warn',c.id);if(pi&&pi.bankChanged&&!pi.bankV.fin)add(`Verify changed bank details (${p.no})`,'imp.pi','bad',c.id)})}
    if(role==='ed'&&A.status==='ed')add(`Final bulk validation of ${A.id} v${A.version}`,'aw.appr','warn',c.id);
    if(role==='qa'){let n=0;Object.values(c.quotes).forEach(q=>Object.values(q).forEach(x=>{if(['Pending','Conditional'].includes(x.sample))n++}));if(n)add(`${n} sample result(s) pending or conditional`,'src.samples','warn',c.id)}
    if(role==='imp'){c.pos.filter(p=>p.ack==='Accepted'&&!c.pis[p.no]).forEach(p=>add(`${p.no}: record supplier PI`,'imp.pi','warn',c.id));c.pos.forEach(p=>{const pi=c.pis[p.no],l=c.lc[p.no];if(pi&&pi.approved&&!(l&&l.docsDone))add(`${p.no}: complete import & banking checks`,'imp.pi','warn',c.id);if(l&&l.appr&&!l.open)add(`${p.no}: open LC`,'imp.lc','ok',c.id)})}
  });
  if(role==='admin'){const n=Object.values(DB.cal).filter(x=>!x.approved).length;if(n)add(`${n} working-day calendar(s) awaiting approval`,'ad.cal','warn');add(`${DB.policy.filter(p=>p.st==='Open').length} open policy decisions`,'ad.policy')}
  return T;
}

/* =====================  PURCHASE CASES  ===================== */
PAGES.cases=()=>({t:'Purchase Cases',sub:'One case = one monthly import booking, tracked end to end. Open a case to see its full flow.',crumbs:[['Command Center','home'],'Purchase Cases'],acts:can('case.new')?`<button class="btn pri" data-act="caseForm">${ic('plus',15)} New purchase case</button>`:'',
 html:table('cases',[{k:'id',t:'Case',r:r=>`<b>${esc(r.id)}</b>`},{k:'name',t:'Name'},{k:'month',t:'Month'},{k:'status',t:'Stage',r:r=>caseBadge(r),s:r=>caseStatus(r)},{k:'serial',t:'Booking',r:r=>esc(r.booking.serial||'—'),s:r=>r.booking.serial||''},{k:'mats',t:'Materials',cls:'r',r:r=>r.booking.lines.length||r.demand.length?`${r.booking.lines.length||'—'}`:'—',s:r=>r.booking.lines.length},{k:'inv',t:'Suppliers invited',cls:'r',r:r=>r.inv.length||'—',s:r=>r.inv.length},{k:'val',t:'Awarded (USD)',cls:'r',r:r=>{const v=sum(lineAwards(r),x=>x.amt);return v?usd(v):'—'},s:r=>sum(lineAwards(r),x=>x.amt)},{k:'next',t:'Next step',r:r=>`<span class="sm">${esc(nextAction(r).t)}</span>`,s:r=>nextAction(r).t}],()=>DB.cases,{row:r=>'case/'+r.id,filters:[{k:'status',label:'Stage',get:r=>caseStatus(r),opts:()=>[...FLOW.map(f=>f[0]),'Completed']}]})});
ACT.caseForm=()=>{if(!need('case.new'))return;const nm=MON[(new Date(NOW()).getUTCMonth()+2)%12];openDlg('New purchase case',`<div class="fg">${F('name','Case name','text','',{req:1,cls:'full'})}${F('month','Booking month','select','Dec 2026',{opts:['Oct 2026','Nov 2026','Dec 2026','Jan 2027','Feb 2027']})}${F('notes','Notes','text','')}</div><p class="mut sm">A case holds the requisition, RFQ, quotations, comparison, approval, POs, PI and LC for one monthly booking.</p>`,{act:'caseSave',ok:'Create case'})};
ACT.caseSave=o=>{if(!o.name)throw new Error('Case name is required.');const[mn,yr]=o.month.split(' ');const mon=mn.slice(0,3).toUpperCase();const idn=DB.cases.filter(c=>c.id.startsWith('IC-'+yr+'-')).length+1;const id=`IC-${yr}-${pad(MON.indexOf(mn.slice(0,3))+1)}${DB.cases.some(c=>c.id===`IC-${yr}-${pad(MON.indexOf(mn.slice(0,3))+1)}`)?'-'+idn:''}`;
  const c=newCase({id,name:o.name,month:o.month,mon,t0:DB.now,notes:o.notes});DB.cases.push(c);DB.seq['IMPBOK-'+mon]=DB.seq['IMPBOK-'+mon]||0;UI.caseId=id;log('Case created',id,o.name,{cid:id});save();closeDlg();toast('Case '+id+' created. Add requisition lines next.');go('rq.board')};
PAGES.case=id=>{
  const c=CASE(id);if(!c)return noCase();const tab=UI.tab['case'+id]||'ov';
  const A=c.appr,aw=lineAwards(c),cnt=csCounts(c);
  const stageCards=[
   ['Requisition','rq.board',c.frozen?'done':'on',`${c.demand.length} lines · ${c.demand.filter(d=>d.status==='accepted').length} accepted · ${c.demand.filter(d=>d.status==='pending').length} pending`],
   ['Booking','rq.booking',c.booking.confirmed?'done':c.frozen?'on':'',c.booking.serial||'Not confirmed'],
   ['RFQ','src.rfq',c.inv.length?'done':c.booking.confirmed?'on':'',c.rfq.no?`${c.rfq.no} · ${c.inv.length} sent`:'Not created'],
   ['Quotes','src.track',rfqClosed(c)?'done':c.inv.length?'on':'',c.inv.length?`${c.inv.filter(i=>i.submitted).length}/${c.inv.length} submitted`:'—'],
   ['Comparison','src.cs',cnt.total&&!cnt.pend?'done':c.inv.length?'on':'',cnt.total?`${cnt.done}/${cnt.total} decided`:'—'],
   ['Approval','aw.appr',A.status==='approved'?'done':['mkt','fin','ed'].includes(A.status)?'on':'',A.id?`${A.id} v${A.version} · ${A.status}`:'Not submitted'],
   ['Purchase orders','po.reg',c.pos.length&&c.pos.every(p=>p.ack==='Accepted')?'done':c.pos.length?'on':'',c.pos.length?`${c.pos.length} PO · ${c.pos.filter(p=>p.sent).length} sent`:'—'],
   ['PI & LC','imp.pi',c.pos.length&&c.pos.every(p=>c.lc[p.no]&&c.lc[p.no].open)?'done':Object.keys(c.pis).length?'on':'',`${Object.keys(c.pis).length} PI · ${Object.values(c.lc).filter(l=>l.open).length} LC`]];
  const tabs_=[['ov','Overview'],['req','Requisition'],['rfq','RFQ & quotes'],['award','Comparison & award'],['po','POs, PI & LC'],['tl','Timeline']];
  let body='';
  if(tab==='ov')body=`<div class="grid g4">${stageCards.map(s=>`<div class="card cp" data-go="${s[1]}" style="cursor:pointer;border-top:3px solid ${s[2]==='done'?'var(--ok)':s[2]==='on'?'var(--warn)':'var(--line)'}"><b>${s[0]}</b> ${s[2]==='done'?pill('Done','p-ok'):s[2]==='on'?pill('In progress','p-warn'):pill('Not started')}<div class="sm mut" style="margin-top:6px">${esc(s[3])}</div></div>`).join('')}</div>`;
  if(tab==='req')body=`<div class="card tbl"><div class="tw"><table><thead><tr><th>Material</th><th class="r">Demand</th><th class="r">Accepted</th><th class="r">Rejected</th><th class="r">Pending</th><th class="r">Book qty</th></tr></thead><tbody>${MATS.filter(p=>c.demand.some(d=>d.pid===p.id)).map(p=>`<tr><td><b>${p.id}</b> ${esc(p.name)}</td><td class="r">${n0(demandSum(c,p.id))}</td><td class="r">${n0(demandSum(c,p.id,'accepted'))}</td><td class="r">${n0(demandSum(c,p.id,'rejected'))}</td><td class="r">${n0(demandSum(c,p.id,'pending'))}</td><td class="r">${reqQty(c,p.id)?n0(reqQty(c,p.id)):'—'} ${p.uom}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(tab==='rfq')body=c.inv.length?`<div class="card tbl"><div class="tw"><table><thead><tr><th>Supplier</th><th>Link</th><th>Deadline (China · Bangladesh)</th><th>Quote</th></tr></thead><tbody>${c.inv.map(i=>`<tr><td><b>${esc(supOf(i.sid).name)}</b></td><td>${pill(ivState(c,i))}</td><td class="sm">${bothTz(i.deadline)}</td><td>${i.submitted?`${i.quoRef} · rev ${i.rev}`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`:emptyState('No RFQ sent yet','Create the RFQ after the booking is confirmed.');
  if(tab==='award')body=aw.length?`<div class="card tbl"><div class="tw"><table><thead><tr><th>Material</th><th>Supplier</th><th class="r">Qty</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead><tbody>${aw.map(x=>`<tr><td>${x.pid} · ${esc(prod(x.pid).name)}</td><td>${esc(supOf(x.sid).name)}</td><td class="r">${n0(x.qty)}</td><td class="r">${usd3(x.price)}</td><td class="r">${usd(x.amt)}</td></tr>`).join('')}</tbody></table></div></div>`:emptyState('Nothing awarded yet','Decide the comparative statement first.');
  if(tab==='po')body=c.pos.length?`<div class="card tbl"><div class="tw"><table><thead><tr><th>PO</th><th>Supplier</th><th class="r">Value</th><th>Dispatch</th><th>Acknowledgment</th><th>PI / LC</th></tr></thead><tbody>${c.pos.map(p=>`<tr class="clk" data-go="po/${p.no}"><td><b>${p.no}</b></td><td>${esc(supOf(p.sid).name)}</td><td class="r">USD ${n0(p.total)}</td><td>${pill(poStatus(c,p))}</td><td>${pill(p.ack)}</td><td>${pill(lcState(c,p))}</td></tr>`).join('')}</tbody></table></div></div>`:emptyState('No purchase orders','POs are generated automatically after final approval.');
  if(tab==='tl')body=`<div class="card"><div class="cp tl">${DB.audit.filter(a=>a.cid===c.id||a.ref===c.id).slice(0,40).map(a=>`<div><b class="sm">${esc(a.a)}</b> <span class="mut sm">${esc(a.ref)}</span><div class="sm">${esc(a.detail)}</div><small>${esc(a.who)} · ${dS(a.ts)}</small></div>`).join('')||'<div class="empty">No events yet.</div>'}</div></div>`;
  return{t:`${esc(c.id)} · ${esc(c.name)}`,sub:`${esc(c.month)} · created ${dD(c.created)} by ${esc(c.by)} ${c.booking.serial?'· booking '+esc(c.booking.serial):''}`,crumbs:[['Command Center','home'],['Purchase Cases','cases'],c.id],
   acts:`<button class="btn" data-act="setCase" data-c="${c.id}">Make working case</button>`,
   html:`${flowBar(c,'')}${nextCard(c)}<div style="margin-top:12px"></div>${tabs('case'+id,tabs_,'ov')}${body}`};
};
ACT.setCase=d=>{UI.caseId=d.c;toast('Working case: '+d.c);render()};

/* =====================  REQUISITION BOARD (01–03)  ===================== */
PAGES['rq.board']=()=>{
  const c=C();if(!c)return noCase();const acc=c.demand.filter(d=>d.status==='accepted').length,rej=c.demand.filter(d=>d.status==='rejected').length,pen=c.demand.filter(d=>d.status==='pending').length;
  const tools=c.frozen?'':`<button class="btn sm" data-act="rqBulkAcc">Accept selected</button><button class="btn sm warnb" data-act="rqBulkRej">Reject selected…</button><button class="btn sm pri" data-act="demandForm">${ic('plus',13)} Add line</button><button class="btn sm" data-act="rqFreeze" ${pen?'':''}>Validate &amp; freeze</button>`;
  const cons=MATS.filter(p=>c.demand.some(d=>d.pid===p.id));
  return{t:'Requisition Board',sub:'Consolidated demand by buyer × customer × material. Accept or reject each line (rejections need a reason), then validate and freeze to open the booking.',crumbs:[['Command Center','home'],['Requisitions','rq.board'],'Requisition Board'],acts:`<span class="pill p-acc">${esc(c.id)} · ${esc(c.month)}</span>`,
   html:`${flowBar(c,'rq.board')}${c.frozen?alertBox('info','Requisition frozen',`${acc} line(s) accepted, ${rej} rejected. Accepted demand moved to the Import Booking Report.`,`<button class="btn sm pri" data-go="rq.booking">Open booking</button>`):pen?alertBox('warn',`${pen} line(s) still pending`,'Accept or reject every line before freezing. Marketing can see rejection reasons and the line can be reverted.'):alertBox('info','All lines decided','Validate and freeze to hand over to the Import Booking Report.')}
   <div style="margin-top:12px">${kpiRow([['Lines',c.demand.length],['Accepted',acc,{cls:'ok'}],['Rejected',rej,{cls:rej?'warn':''}],['Pending',pen,{cls:pen?'warn':'ok'}],['Accepted qty (all UOM)',n0(sum(c.demand.filter(d=>d.status==='accepted'),d=>d.qty))]])}</div>
   <div class="grid g21" style="margin-top:12px"><div>${table('rqb',[
    {k:'id',t:'Line',r:r=>`<b>${r.id}</b>`},{k:'pid',t:'Material',r:r=>`<b>${r.pid}</b> <span class="mut sm">${esc(prod(r.pid).name)}</span>`,s:r=>r.pid+prod(r.pid).name},{k:'buyer',t:'Buyer',r:r=>`${esc(r.buyer)}<div class="mut sm">${esc(r.customer)}</div>`,s:r=>r.buyer+r.customer},{k:'mkt',t:'Marketing'},
    {k:'qty',t:'Demand',cls:'r',r:r=>`${n0(r.qty)} ${prod(r.pid).uom}`,s:r=>r.qty},{k:'status',t:'Status',r:r=>pill(r.status==='accepted'?'Accepted':r.status==='rejected'?'Rejected':'Pending')+(r.reason?`<div class="mut sm">${esc(r.reason)}</div>`:''),s:r=>r.status}],
    ()=>c.demand,{bulk:!c.frozen,act:r=>c.frozen?'':`${r.status==='pending'?`<button class="btn sm pri" data-act="rqAcc" data-id="${r.id}">Accept</button>`:`<button class="btn sm" data-act="rqRev" data-id="${r.id}">Revert</button>`} <button class="btn sm gh" data-act="demandForm" data-id="${r.id}" title="Edit">${ic('edit',14)}</button><button class="btn sm gh" data-act="rqDel" data-id="${r.id}" title="Delete">${ic('trash',14)}</button>`,
    filters:[{k:'status',label:'Status',get:r=>r.status==='accepted'?'Accepted':r.status==='rejected'?'Rejected':'Pending',opts:()=>['Pending','Accepted','Rejected']},{k:'pid',label:'Material',get:r=>r.pid,opts:()=>uniq(c.demand.map(d=>d.pid))}],tools,empty:'No requisition lines',emptyHint:'Add a line, or wait for submitted PRs from the ERP.'})}</div>
   <div class="card"><h3>Consolidated demand</h3><div class="cp">${cons.map(p=>`<div class="hrow" style="grid-template-columns:1fr 80px"><span title="${esc(p.name)}"><b>${p.id}</b> ${esc(p.name)}</span><span class="r">${n0(demandSum(c,p.id,'accepted'))} / ${n0(demandSum(c,p.id))} ${p.uom}</span></div><div class="bar"><i style="width:${demandSum(c,p.id)?Math.round(demandSum(c,p.id,'accepted')/demandSum(c,p.id)*100):0}%"></i></div>`).join('')||'<div class="empty">No demand</div>'}<p class="mut sm" style="margin-top:10px">Bar = accepted share of total demand.</p></div></div></div>`};
};
const selIds=id=>Object.keys(tstate(id).sel).filter(k=>tstate(id).sel[k]);
ACT.rqAcc=d=>{if(!need('demand.edit'))return;const c=C(),x=c.demand.find(r=>r.id===d.id);x.status='accepted';x.reason='';log('Requisition accepted',x.id,`${x.pid} ${n0(x.qty)}`,{cid:c.id});save();renderKeep()};
ACT.rqRev=d=>{if(!need('demand.edit'))return;const c=C(),x=c.demand.find(r=>r.id===d.id);x.status='pending';x.reason='';log('Requisition reverted',x.id,'Back to pending',{cid:c.id});save();renderKeep()};
ACT.rqDel=d=>{if(!need('demand.edit'))return;ask('Delete this requisition line?',()=>{const c=C();c.demand=c.demand.filter(r=>r.id!==d.id);log('Requisition deleted',d.id,'',{cid:c.id});save();renderKeep()},{danger:1,ok:'Delete'})};
ACT.rqBulkAcc=()=>{if(!need('demand.edit'))return;const ids=selIds('rqb');if(!ids.length)return toast('Select at least one line first','warn');const c=C();ids.forEach(id=>{const x=c.demand.find(r=>r.id===id);if(x&&x.status==='pending')x.status='accepted'});tstate('rqb').sel={};log('Bulk accept',c.id,`${ids.length} lines`,{cid:c.id});save();toast(ids.length+' line(s) accepted');renderKeep()};
ACT.rqBulkRej=()=>{if(!need('demand.edit'))return;const ids=selIds('rqb');if(!ids.length)return toast('Select at least one line first','warn');openDlg(`Reject ${ids.length} line(s)`,`${hid('ids',ids.join(','))}<div class="fg">${F('reason','Reason of non-acceptance','select','',{opts:DB.reasons,req:1,cls:'full'})}${F('note','Note (optional)','text','',{cls:'full'})}</div><p class="mut sm">Marketing can see the reason. The line can be reverted later.</p>`,{act:'rqRejSave',ok:'Reject lines',danger:1})};
ACT.rqRejSave=o=>{const c=C();o.ids.split(',').forEach(id=>{const x=c.demand.find(r=>r.id===id);if(x){x.status='rejected';x.reason=o.reason;x.remark=o.note}});tstate('rqb').sel={};log('Bulk reject',c.id,`${o.ids.split(',').length} lines · ${o.reason}`,{cid:c.id});save();closeDlg();toast('Lines rejected');renderKeep()};
ACT.demandForm=d=>{
  if(!need('demand.edit'))return;const c=C();if(c.frozen)return toast('Requisition is frozen — lines cannot be added or edited.','warn');const x=d.id?c.demand.find(r=>r.id===d.id):{};
  openDlg(x.id?'Edit requisition line '+x.id:'Add requisition line',`${hid('id',x.id||'')}<div class="fg">${F('pid','Material','select',x.pid||'P-1001',{opts:matOpts(),req:1,cls:'full'})}${F('buyer','Buyer','text',x.buyer||'',{req:1,attr:'list="dl-buyer"'})}${F('customer','Customer (garment factory)','text',x.customer||'',{req:1,attr:'list="dl-cust"'})}${F('qty','Quantity','number',x.qty||'',{req:1,min:1})}${F('need','Required by','date',x.need||'')}${F('mkt','Marketing person','select',x.mkt||MKTS[0],{opts:MKTS})}${F('remark','Remark','text',x.remark||'',{cls:'full'})}</div><datalist id="dl-buyer">${BUYERS.map(b=>`<option>${b}</option>`).join('')}</datalist><datalist id="dl-cust">${CUSTS.map(b=>`<option>${b}</option>`).join('')}</datalist>`,{act:'demandSave',ok:'Save line'});
};
ACT.demandSave=o=>{const c=C();if(!(+o.qty>0))throw new Error('Quantity must be greater than zero.');if(o.id){const x=c.demand.find(r=>r.id===o.id);Object.assign(x,{pid:o.pid,buyer:o.buyer,customer:o.customer,qty:+o.qty,need:o.need,mkt:o.mkt,remark:o.remark});log('Requisition edited',x.id,'',{cid:c.id})}
  else{const n=c.demand.reduce((m,d)=>Math.max(m,+String(d.id).replace(/\D/g,'')||0),0)+1;c.demand.push({id:'R'+pad(n),buyer:o.buyer,customer:o.customer,pid:o.pid,qty:+o.qty,mkt:o.mkt,need:o.need,status:'pending',reason:'',remark:o.remark});log('Requisition added','R'+pad(n),`${o.pid} ${n0(o.qty)}`,{cid:c.id})}
  save();closeDlg();toast('Requisition line saved');renderKeep()};
ACT.rqFreeze=()=>{if(!need('demand.freeze'))return;const c=C(),p=c.demand.filter(d=>d.status==='pending').length;if(p)return toast(`${p} line(s) still pending — accept or reject each first.`,'warn');if(!c.demand.some(d=>d.status==='accepted'))return toast('Nothing accepted — nothing to book.','warn');
  ask('Frozen demand cannot be edited. Accepted quantities move to the Import Booking Report with “Est. delivery of Marketing requirement” = 100%.',()=>{freezeCase(c);save();toast('Requisition frozen → Import Booking Report ready');go('rq.booking')},{title:'Validate and freeze requisition?',ok:'Freeze'})};

/* =====================  CONFIRMED BOOK QTY  ===================== */
PAGES['rq.booking']=()=>{
  const c=C();if(!c)return noCase();const b=c.booking;
  if(!c.frozen)return{t:'Confirmed Book Qty',crumbs:[['Command Center','home'],['Requisitions','rq.board'],'Confirmed Book Qty'],html:flowBar(c,'rq.booking')+emptyState('Requisition not frozen yet','Validate and freeze the requisition board first.','<button class="btn pri" data-go="rq.board">Open requisition board</button>')};
  const miss=MATS.filter(p=>!b.lines.some(l=>l.pid===p.id));
  return{t:'Confirmed Book Qty',sub:'Import Booking Report → verify and edit quantities → attach the signed document (mandatory) → confirm. The serial is assigned in ascending order.',crumbs:[['Command Center','home'],['Requisitions','rq.board'],'Confirmed Book Qty'],acts:`<span class="pill p-acc">${esc(c.id)}</span><button class="btn" data-act="bkDl">${ic('dl',14)} Download report</button>${b.confirmed?'':`<label class="btn">${ic('up',14)} Upload CSV<input type="file" accept=".csv" data-fsel="bkCsv" style="display:none"></label>`}`,
   html:`${flowBar(c,'rq.booking')}${b.confirmed?alertBox('info',`${esc(b.serial)} confirmed`,`Signed document <b>${esc(b.doc)}</b> (${esc(b.ref||'')}) attached · confirmed ${dS(b.at)} by ${esc(b.by||'')}.`,`<button class="btn sm pri" data-go="src.rfq">Create RFQ</button>`):alertBox('warn','Not confirmed yet','Edit book quantities if needed, then confirm with the signed document. Upload a CSV (<code>product_id,book_qty</code>) to override in bulk.')}
   <div class="grid g21" style="margin-top:12px"><div>${table('bkl',[{k:'pid',t:'Material',r:r=>`<b>${r.pid}</b> <span class="mut sm">${esc(prod(r.pid).name)}</span>`,s:r=>r.pid+prod(r.pid).name},{k:'demand',t:'Accepted demand',cls:'r',r:r=>`${n0(r.demand)} ${prod(r.pid).uom}`,s:r=>r.demand},{k:'pct',t:'Est. delivery of MKT req.',cls:'r',r:r=>r.pct+'%'},{k:'qty',t:'Book qty',cls:'r',r:r=>`<b>${n0(r.qty)}</b> ${prod(r.pid).uom}`,s:r=>r.qty}],()=>b.lines,{key:r=>r.pid,act:r=>b.confirmed?'':`<button class="btn sm" data-act="bkEdit" data-pid="${r.pid}">${ic('edit',13)} Edit</button> <button class="btn sm gh" data-act="bkDel" data-pid="${r.pid}">${ic('trash',14)}</button>`,tools:b.confirmed||!miss.length?'':`<button class="btn sm" data-act="bkAdd">${ic('plus',13)} Add material</button>`})}</div>
   <div class="card"><h3>Confirmation</h3><div class="cp">${dl([['Serial',b.serial||`IMPBOK/2026/${c.mon}/${pad((DB.seq['IMPBOK-'+c.mon]||0)+1)} (on confirm)`],['Lines',b.lines.length],['Signed document',b.doc?esc(b.doc):'<span class="pill p-warn">Required</span>'],['Status',b.confirmed?pill('Confirmed','p-ok'):pill('Draft','p-warn')]])}${b.confirmed?'':`<div style="margin-top:12px"><button class="btn pri" style="width:100%;justify-content:center" data-act="bkConfirmForm">Confirm booking…</button></div>`}</div></div></div>`};
};
ACT.bkDl=()=>{const c=C();downloadCSV('import-booking-report.csv',[['product_id','product_name','accepted_demand','book_qty'],...c.booking.lines.map(l=>[l.pid,prod(l.pid).name,l.demand,l.qty])]);audit(c.id,'Export','Import booking report')};
ACT.bkEdit=d=>{if(!need('booking.edit'))return;const l=C().booking.lines.find(x=>x.pid===d.pid);openDlg('Edit book qty · '+l.pid,`${hid('pid',l.pid)}<div class="fg">${F('pct','Est. delivery of Marketing requirement (%)','number',l.pct,{min:0,step:1})}${F('qty','Book qty ('+prod(l.pid).uom+')','number',l.qty,{min:1,req:1})}</div><p class="mut sm">Accepted demand: ${n0(l.demand)} ${prod(l.pid).uom}. Changing % recalculates the qty; you can then override it.</p>`,{act:'bkSave',ok:'Save'})};
ACT.bkSave=o=>{const c=C(),l=c.booking.lines.find(x=>x.pid===o.pid);const pct=+o.pct,qty=+o.qty;if(!(qty>0))throw new Error('Book qty must be greater than zero.');if(pct!==l.pct&&Math.round(l.demand*pct/100)!==qty)l.qty=Math.round(l.demand*pct/100);else l.qty=qty;l.pct=pct;log('Book qty edited',l.pid,`→ ${n0(l.qty)}`,{cid:c.id});save();closeDlg();renderKeep()};
ACT.bkDel=d=>{if(!need('booking.edit'))return;const c=C();c.booking.lines=c.booking.lines.filter(l=>l.pid!==d.pid);log('Booking line removed',d.pid,'',{cid:c.id});save();renderKeep()};
ACT.bkAdd=()=>{if(!need('booking.edit'))return;const c=C(),miss=MATS.filter(p=>!c.booking.lines.some(l=>l.pid===p.id));openDlg('Add material to booking',`<div class="fg">${F('pid','Material','select','',{opts:miss.map(p=>[p.id,p.id+' · '+p.name]),req:1,cls:'full'})}${F('qty','Book qty','number','',{min:1,req:1})}</div>`,{act:'bkAddSave',ok:'Add'})};

const lineVals=q=>({...(q.spec||{}),listPrice:q.listPrice,tiers:q.tiers||[],disc:q.disc,moq:q.moq});
function pf(c,sid){
  if(c.portal[sid])return c.portal[sid];
  const sp=supOf(sid),iv=c.inv.find(i=>i.sid===sid)||{pids:[]},H=hdrOf(c,sid),qs=c.quotes[sid]||{};
  const h=Object.keys(H).length?clone(H):{legal:sp.name,country:sp.cc==='CN'?'China':sp.cc,address:sp.address||'',kind:'Manufacturer',site:'',contactName:sp.contact,desig:sp.desig||'',email:sp.email,phone:sp.phone,quoteRef:'',quoteDate:'',currency:'USD',payMethod:PAYM[0],payDetail:'',advPct:'',creditDays:'',bankCh:'Applicant (OIL)',incoterm:'FOB',place:'',validity:'',claims:'',loadPort:'',dischargePort:'Chattogram Port',partial:'',transship:'',origin:'',compliance:'',exceptions:'',decName:''};
  const l={};
  iv.pids.forEach(pid=>{const q=qs[pid],p=prod(pid);l[pid]=q?clone(lineVals(q)):{quoteUnit:p.uom,qtyQuoted:reqQty(c,pid),listPrice:'',tiers:[],disc:'',moq:'',grade:p.meta,code:spName(sid,pid),comp:p.comp,sampleAvail:''}});
  return c.portal[sid]={h,l,decl:{ok:false}};
}
function pfErr(c,sid){
  const F=pf(c,sid),iv=c.inv.find(i=>i.sid===sid),e=[];
  FDEF.forEach(f=>{
    const pids=f.s==='h'?['']:iv.pids;
    pids.forEach(pid=>{
      if(f.s==='l'&&!fApplies(f,pid))return;
      const v=fGet(F,f,pid),tag=f.s==='l'?`${pid}: `:'';
      if(fReq(c,f,pid,F)&&!hasVal(v))return e.push({tab:f.tab,k:f.k,pid,m:`${tag}${f.l} is required`});
      if(!hasVal(v))return;
      if(f.t==='number'&&!(+v>=0))e.push({tab:f.tab,k:f.k,pid,m:`${tag}${f.l} must be a valid number`});
      if(['listPrice','moq','qtyQuoted','prodDays','shipDays'].includes(f.k)&&!(+v>0))e.push({tab:f.tab,k:f.k,pid,m:`${tag}${f.l} must be greater than zero`});
      if((f.k==='advPct'||f.k==='disc')&&(+v<0||+v>100))e.push({tab:f.tab,k:f.k,pid,m:`${f.l} must be between 0 and 100`});
      if(f.k==='email'&&!/^\S+@\S+\.\S+$/.test(v))e.push({tab:f.tab,k:f.k,pid,m:'Email address is not valid'});
      if(f.k==='validity'&&Date.parse(v+'T00:00:00Z')<=NOW())e.push({tab:f.tab,k:f.k,pid,m:'Quotation validity must be a future date'});
    });
  });
  iv.pids.forEach(pid=>{const t=(F.l[pid].tiers||[]).filter(x=>hasVal(x.min)||hasVal(x.price));t.forEach(x=>{if(!(+x.min>0&&+x.price>0))e.push({tab:'commercial',k:'tiers',pid,m:`${pid}: each price tier needs a minimum quantity and a price`})});if(t.length>1&&t.some((x,i)=>i&&+x.min<=+t[i-1].min))e.push({tab:'commercial',k:'tiers',pid,m:`${pid}: tier minimum quantities must increase`})});
  if(!F.decl.ok)e.push({tab:'review',k:'decl',pid:'',m:'Tick the declaration to confirm and submit'});
  return e;
}

function csTech(c,pid){

ACT.poSend=()=>{if(!need('po.dispatch'))return;const l=poSel();if(!l.length)return toast('Select PO(s) that are Ready to Dispatch (generate drafts first)','warn');let ok=0;l.forEach(([c,p])=>{if(dispatchPO(c,p))ok++});tstate('por').sel={};save();toast(ok?`${ok} PO(s) sent to the selected suppliers only`:'Email provider failed — POs held, safe retry available',ok?'':'bad');renderKeep()};
ACT.poSched=()=>{if(!need('po.dispatch'))return;if(!poSel().length)return toast('Select PO(s) that are Ready to Dispatch','warn');openDlg('Schedule PO dispatch',`<div class="fg">${F('t','Send at (Bangladesh time)','datetime-local','2026-10-14T10:00',{req:1,cls:'full'})}</div>`,{act:'poSchedSave',ok:'Schedule'})};

ACT.poRun=()=>{let n=0;DB.cases.forEach(c=>c.pos.forEach(p=>{if(p.status==='Scheduled'&&!p.sent){p.status='';dispatchPO(c,p,p.at);n++}}));if(!n)return toast('Nothing scheduled','warn');save();toast(n+' scheduled PO(s) dispatched');renderKeep()};
ACT.poRetry=d=>{if(!need('po.dispatch'))return;const[c,p]=poFind(d.no);p.sent=false;DB.flags.emailFail=false;dispatchPO(c,p);save();toast(`${p.no} re-sent — same PO number, no duplicate`);renderKeep()};
ACT.poDispatch1=d=>{if(!need('po.dispatch'))return;const[c,p]=poFind(d.no);if(poStatus(c,p)!=='Ready to Dispatch')return toast('PO is not ready — fix the failed checks first','warn');p.draft=true;const ok=dispatchPO(c,p);save();toast(ok?'PO sent to supplier':'Email provider failed — PO held, retry available',ok?'':'bad');renderKeep()};
PAGES.po=no=>{
  const[c,po]=poFind(no);if(!po)return{t:'PO not found',crumbs:[['PO Register','po.reg']],html:emptyState('No such PO')};
  const tab=UI.tab['po'+no]||'doc',chk=validatePO(c,po),st=poStatus(c,po),sp=supOf(po.sid);
  const T=[['doc','PO document'],['chk','Dispatch checks'],['mail','Email'],['tl','Timeline']];let b='';
  if(tab==='doc')b=poDoc(c,po);
  if(tab==='chk')b=`<div class="card"><h3>Automatic dispatch conditions <span class="sp"></span>${pill(st)}</h3><div class="cp">${chk.map(x=>`<div class="chk"><span>${x.ok?'<span class="pill p-ok">✓ pass</span>':'<span class="pill p-bad">✗ fail</span>'} <b>${esc(x.k)}</b>${x.ok?'':`<br><small class="mut">${esc(x.why)}</small>`}</span>${!x.ok&&x.k.startsWith('Supplier email')?`<button class="btn sm pri" data-act="supVerify" data-id="${po.sid}">Verify contact…</button>`:''}${!x.ok&&x.k.startsWith('No unresolved')?`<button class="btn sm pri" data-act="poDevOk" data-no="${po.no}">Record acceptance</button>`:''}${!x.ok&&x.k.startsWith('Required')?`<button class="btn sm pri" data-act="poEditForm" data-no="${po.no}">Edit PO details</button>`:''}</span></div>`).join('')}<p class="mut sm" style="margin-top:10px">All five must pass. Any failure sends the PO to the correction queue instead of the supplier. A different legal PO is never regenerated under the same identifier without a revision.</p></div></div>`;
  if(tab==='mail'){const m=poVars(c,po);b=`<div class="mail"><div class="hd">To: ${esc(sp.contact)} &lt;${esc(sp.email)}&gt;<br>From: ${esc(c.sender)}<br>Attachment: ${poFull(po)}.pdf (approved snapshot)<br>Subject: ${esc(fill(TPL().PO.s,m))}</div>${esc(fill(TPL().PO.b,{...m,CONTACT_EMAIL:'[OIL_CONTACT_EMAIL]'}))}</div>`}
  if(tab==='tl')b=`<div class="card"><div class="cp tl">${DB.audit.filter(a=>a.ref===po.no||a.ref===c.appr.id&&/PO/.test(a.a)).slice(0,30).map(a=>`<div><b class="sm">${esc(a.a)}</b><div class="sm">${esc(a.detail)}</div><small>${esc(a.who)} · ${dS(a.ts)}</small></div>`).join('')||'<div class="empty">No events.</div>'}</div></div>`;
  const acts=[];if(!po.sent&&can('po.edit')&&!po.frozen)acts.push(`<button class="btn" data-act="poEditForm" data-no="${po.no}">${ic('edit',14)} Edit details</button>`);
  if(!po.sent&&st==='Ready to Dispatch')acts.push(`<button class="btn pri" data-act="poDispatch1" data-no="${po.no}">${ic('send',14)} Dispatch to supplier</button>`);
  if(po.status==='Delivery Failed')acts.push(`<button class="btn pri" data-act="poRetry" data-no="${po.no}">Retry send</button>`);
  if(po.sent&&po.ack==='Awaiting')acts.push(`<button class="btn" data-act="poRem" data-no="${po.no}">Send reminder</button>`);
  acts.push(`<button class="btn" data-act="poPortal" data-c="${c.id}" data-sid="${po.sid}">View as supplier</button><button class="btn" onclick="window.print()">Print</button>`);
  return{t:`${poFull(po)} · ${esc(sp.name)}`,sub:`${esc(c.id)} · USD ${n0(po.total)} · ${po.lines.length} line(s)`,crumbs:[['Command Center','home'],['PO Register','po.reg'],po.no],acts:acts.join(''),
   html:`${flowBar(c,'po.reg')}${kpiRow([['Dispatch',st,{cls:st==='Sent'?'ok':st==='Correction queue'?'bad':'warn'}],['Acknowledgment',po.ack],['Checks passed',`${chk.filter(x=>x.ok).length}/5`,{cls:chk.every(x=>x.ok)?'ok':'bad'}],['LC / PI',lcState(c,po)]])}${st==='Correction queue'?alertBox('bad','In the correction queue','Open “Dispatch checks” to fix what failed.'):''}<div style="margin-top:12px"></div>${tabs('po'+no,T,'doc')}${b}`};
};

ACT.poResForm=d=>{if(!need('exc.resolve'))return;const[c,p]=poFind(d.no);openDlg('Resolve dispute · '+p.no,`${hid('no',p.no)}<div class="alert warn" style="margin-bottom:10px"><div class="t"><b>Supplier says</b>${esc(p.dispute)}</div></div><div class="fg">${F('o','Outcome','select','stand',{opts:[['stand','PO stands (dispute rejected)'],['chg','Accept change → freeze & re-approve']],cls:'full'})}${F('r','Resolution note','textarea','',{req:1,cls:'full',rows:2})}</div>`,{act:'poResSave',ok:'Record resolution'})};

ACT.piPick=()=>{if(!need('pi.record'))return;const l=allPOs().filter(p=>p.ack==='Accepted');if(!l.length)return toast('No accepted POs yet — PI starts after supplier acceptance','warn');openDlg('Record supplier PI',`<div class="fg">${F('no','Purchase order','select',l[0].no,{opts:l.map(p=>[p.no,`${p.no} · ${supOf(p.sid).name}`]),cls:'full'})}</div>`,{act:'piPickGo',ok:'Continue'})};

   <div class="grid g21" style="margin-top:12px"><div class="grid" style="gap:12px"><div class="card tbl"><h3>PO vs PI ${pi?(pi.approved?pill('Approved','p-ok'):piOk(c,po,pi)?pill('Matched','p-info'):pill('Mismatch')):''}</h3>${pi?`<div class="cp mut sm">PI ${esc(pi.no)} · ${esc(pi.sys)} · rev ${pi.ver} · ${dD(pi.date)}</div><div class="tw"><table><thead><tr><th>Match point</th><th>Result</th><th>Detail</th></tr></thead><tbody>${m.map(x=>`<tr><td>${x.n}</td><td>${pill(x.ok?'Matched':'Mismatch')}</td><td class="sm">${esc(x.d)}</td></tr>`).join('')}</tbody></table></div>${pi.approved?'':`<div class="cp" style="display:flex;gap:8px;flex-wrap:wrap">${piOk(c,po,pi)?`<button class="btn pri" data-act="piApprove" data-no="${po.no}">Approve for import processing</button>`:`<button class="btn warnb" data-act="piClar" data-no="${po.no}">Send clarification / change request</button>`}${pi.bankChanged&&!(pi.bankV.fin&&pi.bankV.sup)?`<button class="btn" data-act="piBank" data-no="${po.no}" data-k="fin">Verify bank — Finance ${pi.bankV.fin?'✓':''}</button><button class="btn" data-act="piBank" data-no="${po.no}" data-k="sup">Verify bank — Supervisor ${pi.bankV.sup?'✓':''}</button>`:''}</div>`}`:`<div class="empty"><b>No PI recorded</b>Record the supplier’s PI — the form is pre-filled from the PO so you only change what differs.</div>`}</div>
   <div class="card"><h3>Import documentation &amp; banking checks <span class="sp"></span><span class="pill">${ROLES.imp.n}</span></h3><div class="cp">${IMPDOCS.map((t,i)=>`<label class="chk" style="cursor:pointer"><input type="checkbox" data-fsel="impDoc" data-no="${po.no}" data-i="${i}" ${lc.docs[i]?'checked':''} ${pi&&pi.approved&&!lc.docsDone?'':'disabled'}><span class="sm">${esc(t)}</span></label>`).join('')}<div class="alert warn" style="margin-top:10px"><div class="t">Indicative checklist only — Finance / Import must validate the exact documents and Bangladesh Bank / authorized-dealer-bank requirements for the import method (Open Policy Items 10–11). Domestic purchases may bypass LC/TT.</div></div><div style="margin-top:10px">${lc.docsDone?'<span class="pill p-ok">Checks complete</span>':`<button class="btn pri" ${pi&&pi.approved&&IMPDOCS.every((_,i)=>lc.docs[i])?'':'disabled'} data-act="impDone" data-no="${po.no}">Mark checks complete</button>`}</div></div></div></div>

 html:`<div class="grid g2">${Object.entries(DB.cal).map(([k,c])=>`<div class="card cp"><div style="display:flex;gap:8px;align-items:center"><h3 style="padding:0;border:0">${esc(c.name)}</h3><span style="flex:1"></span>${pill(c.approved?'Active':'Blocked',c.approved?'p-ok':'p-bad')}</div>${dl([['Time zone',`${c.tz} (UTC${c.off>=0?'+':''}${pad(c.off)}:00)`],['Closing hour',c.close+':00 local'],['Verified years',c.years.join(', ')||'<span style="color:var(--bad)">none</span>'],['Public holidays',c.holidays.length?c.holidays.map(h=>dD(Date.parse(h))).join(', '):'—'],['Make-up workdays',c.makeup.length?c.makeup.map(h=>dD(Date.parse(h))).join(', '):'—']])}<p class="mut sm">${k==='CN'?'Demo data — an administrator must verify against the official schedule each year.':'No approved calendar yet. RFQs to suppliers on this calendar are blocked.'}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${c.approved?`<button class="btn warnb" data-act="calOff" data-k="${k}">Revoke approval</button>`:`<button class="btn pri" data-act="calOn" data-k="${k}">Approve demo calendar</button>`}<button class="btn" data-act="calHol" data-k="${k}">Add holiday / make-up day</button></div></div>`).join('')}</div>
 <div class="card cp" style="margin-top:12px"><h3 style="padding:0;border:0">Deadline rule engine</h3><ol class="sm" style="margin:8px 0 0 18px;line-height:1.8"><li>Confirm supplier country and its assigned calendar.</li><li>Calendar includes public holidays and make-up workdays; yearly data verified by an administrator.</li><li>Store UTC; show China time <b>and</b> Bangladesh time with zone name and offset.</li><li>Closing = Nth eligible working day after the next working day following sending, at the configured hour.</li><li>Reminder one supplier-country working day before close.</li><li>At cut-off, revoke final submit server-side; keep submitted records.</li><li>Extension needs a new date, reason and approver; the original deadline is kept.</li><li>Calendar unavailable → block publication and alert Procurement.</li></ol></div>`});
ACT.calOn=d=>{if(!need('admin.cfg'))return;const c=DB.cal[d.k];c.approved=true;c.years=[2026];if(d.k==='KR')c.holidays=['2026-10-03','2026-10-05','2026-10-09'];DB.exc.filter(e=>e.type==='Calendar unavailable'&&supOf(e.ref).cal===d.k).forEach(e=>{e.status='Resolved';e.res='Calendar approved'});log('Calendar approved',d.k,'Demo data');save();toast(d.k+' calendar approved — add suppliers again in the RFQ');renderKeep()};
ACT.calOff=d=>{if(!need('admin.cfg'))return;DB.cal[d.k].approved=false;log('Calendar revoked',d.k,'');save();renderKeep()};
ACT.calHol=d=>{if(!need('admin.cfg'))return;openDlg('Add calendar day · '+d.k,`${hid('k',d.k)}<div class="fg">${F('date','Date','date','',{req:1})}${F('kind','Type','select','holiday',{opts:[['holiday','Public holiday (non-working)'],['makeup','Make-up working day']]})}</div>`,{act:'calHolSave',ok:'Add'})};
ACT.calHolSave=o=>{const c=DB.cal[o.k];(o.kind==='holiday'?c.holidays:c.makeup).push(o.date);const y=+o.date.slice(0,4);if(!c.years.includes(y))c.years.push(y);log('Calendar day added',o.k,`${o.kind} ${o.date}`);save();closeDlg();renderKeep()};
PAGES['ad.tpl']=()=>{const k=UI.tab.tpl||'RFQ',t=TPL()[k];return{t:'Email Templates',sub:'Copy-ready formats. {PLACEHOLDERS} are filled from validated master and transaction data. Automated messages come from an official OIL sender and are archived.',crumbs:[['Command Center','home'],['Administration','ad.roles'],'Email Templates'],
 html:`<div class="card"><div class="tb-bar"><select data-fsel="tplK">${Object.entries(TPL()).map(([c,x])=>`<option value="${c}" ${c===k?'selected':''}>${esc(x.n)}</option>`).join('')}</select><span style="flex:1"></span>${can('admin.cfg')?`<button class="btn sm pri" data-act="tplForm" data-k="${k}">${ic('edit',13)} Edit template</button>`:''}</div><div class="cp"><div class="mail"><div class="hd">Subject: ${esc(t.s)}</div>${esc(t.b)}</div></div></div>`}};
ACT.tplK=v=>{UI.tab.tpl=v;render()};
ACT.tplForm=d=>{if(!need('admin.cfg'))return;const t=TPL()[d.k];openDlg('Edit template · '+t.n,`${hid('k',d.k)}<div class="fg">${F('s','Subject','text',t.s,{req:1,cls:'full'})}${F('b','Body','textarea',t.b,{req:1,cls:'full',rows:14})}</div><p class="mut sm">Keep the {PLACEHOLDERS} intact.</p>`,{act:'tplSave',ok:'Save template',wide:1})};
ACT.tplSave=o=>{const t=DB.tpl[o.k];t.s=o.s;t.b=o.b;log('Template edited',o.k,'');save();closeDlg();renderKeep()};
PAGES['ad.policy']=()=>({t:'Policy & Approval Authority',sub:'Decisions OIL must confirm before the specification is final. Nothing is pre-filled. Approval limits and alternates are configurable rules — no BDT amount is assumed.',crumbs:[['Command Center','home'],['Administration','ad.roles'],'Policy'],
 html:`${kpiRow([['Open',DB.policy.filter(p=>p.st==='Open').length,{cls:'warn'}],['Confirmed',DB.policy.filter(p=>p.st==='Confirmed').length,{cls:'ok'}]])}<div style="margin-top:12px">${table('pol',[{k:'n',t:'#',cls:'r'},{k:'t',t:'Policy decision',r:r=>`<span class="sm">${esc(r.t)}</span>`},{k:'owner',t:'Owner',r:r=>esc(r.owner)||'<span class="mut">—</span>'},{k:'out',t:'Decision',r:r=>esc(r.out)||'<span class="mut">—</span>'},{k:'date',t:'Target',r:r=>esc(r.date)||'—'},{k:'st',t:'Status',r:r=>pill(r.st,r.st==='Confirmed'?'p-ok':'p-warn')}],()=>DB.policy.map(p=>({...p,id:p.n})),{act:r=>`<button class="btn sm" data-act="polForm" data-n="${r.n}">Update</button>`})}</div>
 <div class="card" style="margin-top:12px"><h3>Approval authority matrix <span class="sp"></span><small class="mut">Policy item 1 — leave blank until OIL decides</small></h3><div class="cp">${DB.authority.map((a,i)=>`<form data-submit="autSave" class="chk" style="gap:8px">${hid('i',i)}<b style="width:70px">${a.lvl}</b><input name="lim" value="${esc(a.lim)}" placeholder="Limit — TBD, not assumed" style="flex:1"><input name="who" value="${esc(a.who)}" placeholder="Approver / alternate" style="flex:1"><button class="btn sm">Save</button></form>`).join('')}</div></div>`});
ACT.polForm=d=>{if(!need('admin.cfg'))return;const p=DB.policy.find(x=>x.n===+d.n);openDlg('Policy item #'+p.n,`${hid('n',p.n)}<p class="sm">${esc(p.t)}</p><div class="fg">${F('owner','Decision owner','text',p.owner)}${F('date','Target date','date',p.date)}${F('out','Decision / outcome','textarea',p.out,{cls:'full',rows:2})}${F('st','Status','select',p.st,{opts:['Open','Confirmed']})}</div>`,{act:'polSave',ok:'Save'})};
ACT.polSave=o=>{const p=DB.policy.find(x=>x.n===+o.n);Object.assign(p,{owner:o.owner,date:o.date,out:o.out,st:o.st});log('Policy item updated','#'+p.n,o.st);save();closeDlg();renderKeep()};
ACT.autSave=o=>{if(!need('admin.cfg'))return;Object.assign(DB.authority[+o.i],{lim:o.lim,who:o.who});log('Authority rule saved',DB.authority[+o.i].lvl,'');save();toast('Authority rule saved')};
const ACS=[['AC-01','Marketing submits complete PR','Sequential PR ID created; Procurement notified','01','pr'],['AC-02','Two compatible PRs consolidated','Quantities trace back to originals; no double allocation','02','rq.board'],['AC-03','RFQ published for three China vendors','Three distinct, vendor-bound URLs sent and logged','06–07','src.track'],['AC-04','Quote opened by vendor A','Vendor A cannot access vendor B’s response','08','portal'],['AC-05','RFQ crosses official China holiday','Deadline adjusts according to approved calendar','09','ad.cal'],['AC-06','RFQ reaches cutoff','New final submissions rejected server-side; old submissions preserved','09','portal'],['AC-07','Procurement approves deadline extension','Prior deadline retained, new one communicated, audit entry created','09','src.track'],['AC-08','Supplier leaves required GSM empty','Final submission blocked with clear validation error','08','portal'],['AC-09','Quote in alternate currency / UOM','Comparison converts on controlled source / date and shows assumptions','10','src.cs'],['AC-10','QA marks sample failed','Supplier cannot be awarded without a documented authorised exception','12','src.samples'],['AC-11','Marketing returns evaluation','Finance stage remains unavailable until resubmission and ACK','15','aw.appr'],['AC-12','Finance returns on cash / terms issue','ED approval not available until Finance reapproves','16','aw.appr'],['AC-13','ED finally approves valid package','PO generated with correct locked approved data','17–18','aw.appr'],['AC-14','PO missing a required Incoterms named place','PO auto-email blocked, exception assigned','18','po.reg'],['AC-15','PO passes validation','Only selected supplier receives approved PDF and ACK link','19','po.reg'],['AC-16','Supplier disputes price on PO','Dispute recorded; updated terms require approved revision','20','po.disp'],['AC-17','PI bank details change','Independent validation task created; processing restricted','21','imp.pi'],['AC-19','Email provider transiently fails','Controlled retry without generating a second PO ID','19','po.reg'],['AC-20','Manager reviews dashboard','Role-permitted live stage, delays and audit trail visible','—','home']];
PAGES['ad.tests']=()=>({t:'Acceptance Tests',sub:'Walk each test, then record the result. These come from the BRD and double as the UAT checklist for development.',crumbs:[['Command Center','home'],['Administration','ad.roles'],'Acceptance Tests'],acts:`<span class="pill p-ok">${ACS.filter(a=>DB.tests[a[0]]==='Pass').length}/${ACS.length} passed</span>`,
 html:table('acs',[{k:'id',t:'ID',r:r=>`<b>${r.id}</b>`},{k:'g',t:'Given / when'},{k:'e',t:'Expected outcome',r:r=>`<span class="sm">${esc(r.e)}</span>`},{k:'s',t:'Stage'},{k:'res',t:'Result',r:r=>`<select data-fsel="acR" data-id="${r.id}" style="min-width:90px"><option value="">—</option><option ${DB.tests[r.id]==='Pass'?'selected':''}>Pass</option><option ${DB.tests[r.id]==='Fail'?'selected':''}>Fail</option></select>`,s:r=>DB.tests[r.id]||''}],()=>ACS.map(a=>({id:a[0],g:a[1],e:a[2],s:a[3],go:a[4]})),{act:r=>`<button class="btn sm" data-go="${r.go}">Try it</button>`})});
ACT.acR=(v,el)=>{DB.tests[el.dataset.id]=v;save();renderKeep()};

PAGES['ad.demo']=()=>({t:'Demo Utilities',sub:'Jump a case to any stage, simulate failures, or reset all demo data. Everything is saved in this browser only.',crumbs:[['Command Center','home'],['Administration','ad.roles'],'Demo Utilities'],
 html:`<div class="grid g2"><div class="card cp"><h3 style="padding:0;border:0">Load a case to a stage</h3><p class="mut sm">Rebuilds the selected case with realistic data up to the chosen point so you can test any step.</p><form data-submit="stageLoad"><div class="fg">${F('c','Case','select',UI.caseId,{opts:caseOpts()})}${F('s','Stage','select','quotes',{opts:STAGES.map(s=>[s[0],s[1]])})}</div><div style="margin-top:12px"><button class="btn pri">Load stage</button></div></form></div>
 <div class="card cp"><h3 style="padding:0;border:0">Simulations &amp; data</h3><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><label class="chk"><input type="checkbox" data-fsel="failMail" ${DB.flags.emailFail?'checked':''}><span>Email provider fails on next PO dispatch (AC-19)</span></label><button class="btn" data-act="exportDB">${ic('dl',14)} Export all data as JSON</button><button class="btn bad" data-act="resetDB">Reset all demo data</button></div></div></div>`});
ACT.stageLoad=o=>{loadStage(o.c,o.s);UI.caseId=o.c;UI.csPid='';UI.tbl={};toast('Case '+o.c+' loaded to: '+STAGES.find(x=>x[0]===o.s)[1]);go('case/'+o.c)};
ACT.failMail=(v,el)=>{DB.flags.emailFail=el.checked;save();toast(el.checked?'Next PO dispatch will fail — use Retry afterwards':'Email failure simulation off','warn')};
ACT.exportDB=()=>exportJSON();
ACT.resetDB=()=>ask('Reset all demo data to the original three cases?',()=>{localStorage.removeItem(KEY);buildDB();UI.tbl={};toast('Demo data reset');go('home');render()},{danger:1,ok:'Reset'});

/* =====================  INIT  ===================== */
function loadDB(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.v===4){DB=d;return}}}catch(e){}buildDB()}
function init(){
  loadDB();if(!UI.caseId||!CASE(UI.caseId))UI.caseId=(DB.cases.find(c=>c.id==='IC-2026-10')||DB.cases[0]).id;
  const app=document.createElement('div');app.id='app';document.body.appendChild(app);const t=document.createElement('div');t.id='toasts';document.body.appendChild(t);const d=document.createElement('div');d.id='dlg';document.body.appendChild(d);
  if(!location.hash)location.hash='#/home';UI.fast=true;render();UI.fast=false;
}

init();
})();
</script></body></html>
